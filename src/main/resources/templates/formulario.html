<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">TechStore</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="form-container">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="mb-4" th:text="${titulo}">Registrar producto</h2>

                    <form th:if="${producto.id == null}" th:action="@{/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <input type="text" class="form-control" th:field="*{categoria}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cantidad</label>
                                <input type="number" min="0" class="form-control" th:field="*{cantidad}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" rows="4" th:field="*{descripcion}" required></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="imagen-nueva" class="form-label">Imagen del producto</label>
                            <input id="imagen-nueva" type="file" name="archivoImagen" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp">
                            <div class="form-text">JPG, PNG, GIF o WEBP. Máximo 5 MB.</div>
                            <div class="text-danger small" th:if="${errorImagen}" th:text="${errorImagen}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" th:href="@{/productos}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar producto</button>
                        </div>
                    </form>

                    <form th:unless="${producto.id == null}" th:action="@{'/productos/actualizar/' + ${producto.id}}" th:object="${producto}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <input type="text" class="form-control" th:field="*{categoria}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cantidad</label>
                                <input type="number" min="0" class="form-control" th:field="*{cantidad}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" rows="4" th:field="*{descripcion}" required></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="imagen-edicion" class="form-label">Imagen del producto</label>
                            <div class="mb-3" th:if="${producto.imagen != null}">
                                <img th:src="@{'/productos/' + ${producto.id} + '/imagen'}" alt="Imagen actual del producto" class="img-thumbnail" style="max-height: 180px;">
                            </div>
                            <input id="imagen-edicion" type="file" name="archivoImagen" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp">
                            <div class="form-text">Selecciona una imagen nueva para reemplazar la actual. JPG, PNG, GIF o WEBP; máximo 5 MB.</div>
                            <div class="text-danger small" th:if="${errorImagen}" th:text="${errorImagen}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" th:href="@{/productos}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Actualizar producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
