<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">TechStore</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/productos/nuevo}">Registrar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Inventario de productos</h1>
            <a class="btn btn-primary" th:href="@{/productos/nuevo}">Agregar producto</a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.id}">1</td>
                            <td>
                                <img th:if="${producto.imagen != null}" th:src="@{'/productos/' + ${producto.id} + '/imagen'}" th:alt="${producto.nombre}" width="64" height="64" class="rounded object-fit-cover">
                                <span th:unless="${producto.imagen != null}" class="text-muted small">Sin imagen</span>
                            </td>
                            <td th:text="${producto.nombre}">Nombre</td>
                            <td th:text="${producto.categoria}">Categoría</td>
                            <td th:text="'COP ' + ${#numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}">Precio</td>
                            <td th:text="${producto.cantidad}">0</td>
                            <td th:text="${producto.descripcion}">Descripción</td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a class="btn btn-sm btn-warning" th:href="@{'/productos/editar/' + ${producto.id}}">Editar</a>
                                    <a class="btn btn-sm btn-danger" th:href="@{'/productos/eliminar/' + ${producto.id}}" onclick="return confirm('¿Desea eliminar este producto?');">Eliminar</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${productos.isEmpty()}">
                            <td colspan="8" class="text-center py-4 text-muted">No hay productos registrados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
