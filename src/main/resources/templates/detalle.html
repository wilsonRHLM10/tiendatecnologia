<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${producto.nombre}">Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">TechStore</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 th:text="${producto.nombre}">Nombre del producto</h1>
                    <span class="badge bg-primary fs-6" th:text="${producto.categoria}">Categoría</span>
                </div>

                <div class="row g-4">
                    <div class="col-md-6" th:if="${producto.imagen != null}">
                        <img th:src="@{'/productos/' + ${producto.id} + '/imagen'}" th:alt="${producto.nombre}" class="img-fluid rounded" style="max-height: 360px; object-fit: contain;">
                    </div>
                    <div class="col-md-6">
                        <p><strong>Precio:</strong> <span th:text="'COP ' + ${#numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}">Precio</span></p>
                        <p><strong>Cantidad disponible:</strong> <span th:text="${producto.cantidad}">0</span></p>
                        <p><strong>ID:</strong> <span th:text="${producto.id}">1</span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Descripción:</strong></p>
                        <p th:text="${producto.descripcion}">Descripción</p>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <a class="btn btn-warning" th:href="@{'/productos/editar/' + ${producto.id}}">Editar</a>
                    <a class="btn btn-danger" th:href="@{'/productos/eliminar/' + ${producto.id}}" onclick="return confirm('¿Desea eliminar este producto?');">Eliminar</a>
                    <a class="btn btn-secondary" th:href="@{/productos}">Volver</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
